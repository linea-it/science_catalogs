
repos:
    # Compare the local template version to the latest remote template version
    # This hook should always pass. It will print a message if the local version
    # is out of date.
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: check-lincc-frameworks-template-version
        name: Check template version
        description: Compare current template version against latest
        verbose: true
        stages: [manual]
    # Clear output from jupyter notebooks so that only the input cells are committed.
  - repo: local
    hooks:
      - id: jupyter-nb-clear-output
        name: Clear output from Jupyter notebooks
        description: Clear output from Jupyter notebooks.
        files: \.ipynb$
        exclude: ^docs/pre_executed
        stages: [pre-commit]
        language: python
        additional_dependencies: [jupyter]
        entry: jupyter nbconvert --clear-output
    # Prevents committing directly branches named 'main' and 'master'.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: debug-statements
      - id: no-commit-to-branch
        name: Prevent main branch commits
        description: Prevent the user from committing directly to the primary branch.
      - id: check-added-large-files
        name: Check for large files
        description: Prevent the user from committing very large files.
        args: ['--maxkb=500']
    # Verify that pyproject.toml is well formed
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject
        name: Validate pyproject.toml
        description: Verify that pyproject.toml adheres to the established schema.
    # Verify that GitHub workflows are well formed
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.10
    hooks:
      - id: ruff
        name: Lint code using ruff; sort and organize imports
        types_or: [ python, pyi ]
        args: ["--fix"]
      - id: ruff-format
        name: Format code using ruff
        types_or: [ python, pyi, jupyter ]
  - repo: https://github.com/lincc-frameworks/pre-commit-hooks
    rev: v0.2.2
    hooks:
      - id: pre-executed-nb-never-execute
        name: Check pre-executed notebooks
        files: ^docs/pre_executed/.*\.ipynb$
        verbose: true
        args:
          ["docs/pre_executed/"]
    # Keep commits fast; run the complete test suite once before pushing.
  - repo: local
    hooks:
      - id: pytest-check
        name: Run unit tests before push
        description: Run the complete unit-test suite without coverage overhead.
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: sphinx-docs-build
        name: Build documentation manually
        description: Build Sphinx documentation without executing notebooks when explicitly requested.
        entry: >-
          python -m sphinx.cmd.build -M html docs _readthedocs
          -T -E -d _readthedocs/doctrees
          -D language=en
          -D exclude_patterns=notebooks/*,_build,**.ipynb_checkpoints
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
