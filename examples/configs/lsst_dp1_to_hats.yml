# Run example:
# science-catalogs examples/configs/lsst_dp1_to_hats.yml examples/output/lsst_dp1_to_hats

input:
  catalog_folder: tests/data
  catalog_pattern: "lsst_dp1_scrambled_sample_1000.parq"
  compute_magnitude: false
  compute_dereddening: false
  selected_bands: []
  ra_col: coord_ra
  dec_col: coord_dec

output:
  save_as: hats
  hats_artifact_name: lsst_dp1_hats

cluster:
  executor: local
  local:
    n_workers: 3
    threads_per_worker: 2
    memory_limit: "4GB"
  # To run with a SLURM cluster, switch executor to slurm and uncomment:
  # executor: slurm
  # slurm:
  #   interface: ib0
  #   queue: cpu
  #   cores: 2
  #   processes: 1
  #   memory: 48GB
  #   walltime: "01:00:00"
  #   job_extra_directives:
  #     - "--account=<account>"
  #   dask_scale_number: 15

collection:
  margin_threshold: 10.0
