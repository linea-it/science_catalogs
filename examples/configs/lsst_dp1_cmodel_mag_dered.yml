# Run example:
# science-catalogs examples/configs/lsst_dp1_cmodel_mag_dered.yml examples/output/lsst_dp1_cmodel_mag_dered

metadata:
  release: LSST_DP1

input:
  catalog_path: tests/data
  catalog_pattern: "lsst_dp1_scrambled_sample_1000.parq"
  user_selected_cols:
    - objectId
    - coord_ra
    - coord_dec
    - u_cModelFlux
    - g_cModelFlux
    - r_cModelFlux
    - i_cModelFlux
    - z_cModelFlux
    - y_cModelFlux
    - u_cModelFluxErr
    - g_cModelFluxErr
    - r_cModelFluxErr
    - i_cModelFluxErr
    - z_cModelFluxErr
    - y_cModelFluxErr
    - detect_fromBlend
    - detect_isDeblendedModelSource
    - detect_isIsolated
    - refExtendedness
    - tract
    - patch
  is_id_in_index: false
  ra_col: coord_ra
  dec_col: coord_dec

photometry:
  bands: [u, g, r, i, z, y]
  band_case: lower_case
  keep_input_columns: false
  magnitude:
    system: AB
    flux_unit: nJy
  dereddening:
    extinction_coefficients:
      u: 4.81
      g: 3.64
      r: 2.70
      i: 2.06
      z: 1.58
      y: 1.31
  measurements:
    - name: cmodel
      input:
        type: flux
        value_pattern: BAND_cModelFlux
        error_pattern: BAND_cModelFluxErr
      output:
        type: mag_dered
        value_pattern: BAND_cModelMag_dered
        error_pattern: BAND_cModelMagErr_dered
  invalid_handling:
    value:
      nonfinite_is_invalid: true
      limit:
        value: 99.0
        comparison: greater_or_equal
        use_absolute: true
      replacement:
        value: 99.0
        when: invalid
    error:
      nonfinite_is_invalid: true
      limit:
        value: 99.0
        comparison: greater_or_equal
        use_absolute: true
      replacement:
        value: 99.0
        when: paired_invalid

output:
  save_as: parquet
  base_path: examples/output/lsst_dp1_cmodel_mag_dered
  col_for_filename: tract

execution:
  executor: local
  local:
    n_workers: 3
    threads_per_worker: 2
    memory_limit: "4GB"
  # To run with a SLURM cluster, switch executor to slurm and uncomment:
  # executor: slurm
  # slurm:
  #   interface: ib0
  #   queue: cpu
  #   cores: 2
  #   processes: 1
  #   memory: 48GB
  #   walltime: "01:00:00"
  #   job_extra_directives:
  #     - "--account=<account>"
  #   dask_scale_number: 15

dust:
  use_dustmap: sfd
