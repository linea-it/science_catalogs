# Run example:
# science-catalogs examples/configs/des_dr2_mag_auto_dered.yml examples/output/des_dr2_mag_auto_dered

metadata:
  release: DES_DR2

input:
  catalog_path: tests/data
  catalog_pattern: "des_dr2_sample_1000.fits"
  user_selected_cols:
    - COADD_OBJECT_ID
    - TILENAME
    - RA
    - DEC
    - MAG_AUTO_G_DERED
    - MAG_AUTO_R_DERED
    - MAG_AUTO_I_DERED
    - MAG_AUTO_Z_DERED
    - MAG_AUTO_Y_DERED
    - MAGERR_AUTO_G
    - MAGERR_AUTO_R
    - MAGERR_AUTO_I
    - MAGERR_AUTO_Z
    - MAGERR_AUTO_Y
    - EXTENDED_CLASS_COADD
    - FLAGS_I
  is_id_in_index: false
  ra_col: RA
  dec_col: DEC

photometry:
  bands: [G, R, I, Z, Y]
  band_case: lower_case
  keep_input_columns: false
  measurements:
    - name: auto
      input:
        type: mag_dered
        value_pattern: MAG_AUTO_BAND_DERED
        error_pattern: MAGERR_AUTO_BAND
      output:
        type: mag_dered
        value_pattern: mag_BAND
        error_pattern: magerr_BAND
  invalid_handling:
    value:
      nonfinite_is_invalid: true
      limit: {value: 99.0, comparison: greater_or_equal, use_absolute: true}
      replacement: {value: 99.0, when: invalid}
    error:
      nonfinite_is_invalid: true
      limit: {value: 99.0, comparison: greater_or_equal, use_absolute: true}
      replacement: {value: 99.0, when: paired_invalid}

output:
  save_as: parquet
  base_path: examples/output/des_dr2_mag_auto_dered
  target_rows_per_part: 1000000
  order_by: COADD_OBJECT_ID
  col_for_filename: TILENAME

execution:
  executor: local
  local:
    n_workers: 3
    threads_per_worker: 2
    memory_limit: "4GB"
  # To run with a SLURM cluster, switch executor to slurm and uncomment:
  # executor: slurm
  # slurm:
  #   interface: ib0
  #   queue: cpu
  #   cores: 2
  #   processes: 1
  #   memory: 48GB
  #   walltime: "01:00:00"
  #   job_extra_directives:
  #     - "--account=<account>"
  #   dask_scale_number: 15
